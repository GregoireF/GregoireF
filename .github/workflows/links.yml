name: Links

on:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths: ["**.md", "profile.config.ts", ".lycheeignore"]
  workflow_dispatch:

permissions: {}

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200..=299,403,429
            --exclude-path play/fixtures
            README.md docs profile.config.ts
          fail: true
          token: ${{ github.token }}
